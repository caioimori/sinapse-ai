# IDS Gate Evaluation — phase->gates mapping (IDS Gate Wiring frente)
# Consumed by .sinapse-ai/core/ids/gate-evaluator.js to wire the inert
# verification gates (G1-G5) into the live SDC workflow.
# G1-G4 are advisory (warnings/opportunities only). G5 is blocking — when its
# result reports a BLOCKER violation, the development phase fails fast with a
# correction prompt. failOpen guarantees a degraded evaluator never halts dev.
ids:
  gateEvaluation:
    enabled: true
    failOpen: true # if the evaluator degrades, log and proceed
    timeoutMs: 2000
    registryPath: .sinapse-ai/data/entity-registry.yaml
    phaseGates:
      epic_creation: # trigger: *create-epic
        - G1
      story_creation: # trigger: *draft
        - G2
      story_validation: # trigger: *validate-story-draft
        - G3
      2_development: # trigger: start of Phase 2 (executeDevelopmentPhase)
        - G4
        - G5 # G5 is blocking — keep it last
# Boundary Mapping — Framework-Project Separation (Epic BM)
# Controls deterministic protection of framework core files via Claude Code deny rules.
# When frameworkProtection is true (default), .claude/settings.json includes deny rules
# that block Edit/Write operations on L1/L2 paths listed in 'protected' below.
# Set to false for framework contributors who need to edit core files directly.
# NOTE: This flag is read by the installer during settings.json generation.
# Changing this value alone does NOT add/remove deny rules — re-run the installer.
# SINGLE SOURCE OF TRUTH: Both pre-commit hook (framework-guard.js) and
# the installer read protected/exceptions from here. Do NOT hardcode paths elsewhere.
boundary:
  # CONTRIBUTOR MODE (deliberate, not temporary). This is the framework's OWN
  # repo, where core files are developed — so protection is OFF here on purpose.
  # Installed projects default to TRUE (see packages/installer core-config-template)
  # and get the deny rules generated by generate-settings-json. So users ARE
  # protected; only framework contributors edit core directly. Verified
  # 2026-06-11: protection=true generates 64 deny rules; false generates 0.
  frameworkProtection: false
  # L1/L2 paths — blocked from editing in project mode
  # Glob syntax: ** matches any depth, * matches single segment
  protected:
    - .sinapse-ai/core/**
    - .sinapse-ai/development/tasks/**
    - .sinapse-ai/development/templates/**
    - .sinapse-ai/development/checklists/**
    - .sinapse-ai/development/workflows/**
    - .sinapse-ai/infrastructure/**
    - .sinapse-ai/constitution.md
    - bin/sinapse.js
    - bin/sinapse-init.js
  # L3 paths — mutable exceptions (allowed even within .sinapse-ai/)
  exceptions:
    - .sinapse-ai/data/**
    - .sinapse-ai/development/agents/*/MEMORY.md
    - .sinapse-ai/core/config/schemas/**
    - .sinapse-ai/core/config/template-overrides.js

