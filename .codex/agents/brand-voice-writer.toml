s or unavailable model policy block the task. Keep the complete JSON within 12000 characters, cited knowledge within 6000 and profile within 3000; never preload the corpus.\nUse native Codex collaboration for delegation; never start a nested codex or claude process.\nDo not modify Claude Code configuration as part of Codex activation."
