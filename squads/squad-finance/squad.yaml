# ══════════════════════════════════════════════════════════════════════════════
# HANDOFFS — Intra-squad routing matrix
# ══════════════════════════════════════════════════════════════════════════════

handoffs:
  finance-orqx:
    delegates_to:
      - profitability-analyst: "Analise de rentabilidade, P&L, margens, unit economics realizado"
      - pricing-strategist: "Modelos de pricing, tiers, propostas comerciais"
      - budget-controller: "Forecast operacional, budget mensal, cash flow, vendor cost"
      - revenue-analyst: "Reconciliacao de receita, aging, collection"
      - cost-optimizer: "Auditoria FinOps, identificacao de waste, otimizacao de spend"
      - forecast-strategist: "Forecast estrategico, cenarios, runway, breakeven, cohort"
      - fiscal-compliance-br: "Regime tributario, NF, ISS, obrigacoes acessorias"
    receives_from:
      - "@sinapse-orqx (Imperator) — demandas financeiras roteadas pelo Imperator"

  profitability-analyst:
    delegates_to:
      - cost-optimizer: "Quando custo identificado em P&L revela waste estrutural"
      - fiscal-compliance-br: "Quando carga tributaria afeta margem por projeto"
    escalates_to:
      - finance-orqx

  pricing-strategist:
    delegates_to:
      - fiscal-compliance-br: "Gross-up de impostos para precificacao final"
      - profitability-analyst: "Validacao de margem alvo do tier"
    escalates_to:
      - finance-orqx

  budget-controller:
    delegates_to:
      - cost-optimizer: "Vendor cost optimization e renegociacao de contrato"
      - forecast-strategist: "Coordenacao de rolling forecast estrategico"
    escalates_to:
      - finance-orqx

  revenue-analyst:
    delegates_to:
      - fiscal-compliance-br: "Regime de competencia vs caixa por contrato; retencoes"
      - forecast-strategist: "Dados de recorrencia para cohort e LTV"
    escalates_to:
      - finance-orqx

  cost-optimizer:
    delegates_to:
      - budget-controller: "Saving incorporado em budget pacing"
      - forecast-strategist: "Saving projetado em forecast de despesa"
    escalates_to:
      - finance-orqx

  forecast-strategist:
    delegates_to:
      - budget-controller: "Forecast operacional do mes corrente"
      - fiscal-compliance-br: "Projecao de carga tributaria por cenario"
    escalates_to:
      - finance-orqx

  fiscal-compliance-br:
    delegates_to:
      - revenue-analyst: "Emissao de NF e reconciliacao apos definicao fiscal"
      - pricing-strategist: "Repasse de gross-up para pricing"
    escalates_to:
      - finance-orqx

