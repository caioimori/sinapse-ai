cross_squad_connections:
  inbound:
    - squad-brand: "Brand guidelines, identidade visual, paleta de cores, tom visual, root tokens para Atlas"
    - squad-research: "Pesquisa de audiencia, analise de concorrentes, benchmarks de conversao, feeds para Vertex"
    - squad-copy: "Copy strategy, headlines, microcopy, CTA labels"
    - squad-product: "PRDs, roadmap de features, personas, fluxo de uso diario para Axiom"
    - squad-council: "Pressurizacao estrategica (v2.0: fonte dos 5 principios de premium packaging)"
    - squad-finance: "Pricing power, unit economics que justificam posicionamento premium (input para Aura)"
  outbound:
    - squad-design: "Art direction brief, design tokens (DDL completo do Atlas), motion spec, wireflow anotado, component spec"
    - squad-animations: "Motion spec, easing curves, timing tokens, kinesthetic narrative, custom motion signatures"
    - squad-content: "Hierarquia visual para conteudo, pacing de leitura"
    - squad-growth: "CRO patterns map, hipoteses de impacto, metricas de conversao + retencao"
    - squad-commercial: "Pricing page art direction, premium packaging brief"

