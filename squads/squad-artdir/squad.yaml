name: squad-artdir
version: "2.0.0"
description: >
  Art direction for retention, conversion AND platform premium packaging.
  v1.0 was born for landing pages. v2.0 extends the framework from 7 to 10
  Pillars to cover SaaS platforms, logged-in product surfaces, multi-surface
  design systems, and premium packaging that justifies 3x pricing. The core
  principle is unchanged: every pixel carries behavioral intent, every
  aesthetic decision is justified by a psychological principle and measured
  by either conversion (LP) or retention + perceived value (Platform).
author: Caio Imori
license: MIT
slashPrefix: SINAPSE

metadata:
  created_at: "2026-04-10"
  updated_at: "2026-04-12"
  created_by: "squad-creator (Craft)"
  expanded_by: "sinapse-orqx (Imperator) via EPIC-artdir-v2"
  agents_count: 14
  tasks_count: 13
  knowledge_bases_count: 8
  workflows_count: 3
  checklists_count: 1
  templates_count: 1
  total_files: 46
  agents: 14
  tasks: 13
  workflows: 0
  knowledge_bases: 8
  checklists: 1
  templates: 1
  preferences: 0

agents:
  # ═══════════════════════════════════════════════════════════════════════════
  # v1.0 CORE (10 agents — LP-focused, preserved verbatim)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: artdir-orqx
    name: Canvas
    file: agents/artdir-orqx.md
    role: "Orquestrador — coordena os 10 pilares, roteia briefings (LP vs Platform), entrega os deliverables padrao"
    tasks:
      - create-art-direction-brief
      - validate-against-pillars

  - id: visual-strategist
    name: Prism
    file: agents/visual-strategist.md
    role: "Define linguagem visual, mood, posicionamento estetico baseado em audiencia e categoria"
    tasks:
      - diagnose-visual-language
      - create-art-direction-brief

  - id: motion-architect
    name: Tempo
    file: agents/motion-architect.md
    role: "Sistema de motion — timing, easing, selecao de lib, performance, Disney 12 principles"
    tasks:
      - specify-motion-system

  - id: type-systemist
    name: Kern
    file: agents/type-systemist.md
    role: "Type scale, font pairing, tracking, hierarquia tipografica, fluid typography, custom type (premium)"
    tasks:
      - create-art-direction-brief

  - id: color-psychologist
    name: Spectrum
    file: agents/color-psychologist.md
    role: "Sistemas de cor justificados por neurociencia, WCAG AAA, Von Restorff, emotion mapping"
    tasks:
      - design-color-system

  - id: layout-engineer
    name: Grid
    file: agents/layout-engineer.md
    role: "Grids, spacing, full-bleed vs contained, responsividade, container queries"
    tasks:
      - create-wireflow

  - id: ia-architect
    name: Flow
    file: agents/ia-architect.md
    role: "Arquitetura de informacao para retencao cognitiva — disclosure, Zeigarnik, curiosity gaps"
    tasks:
      - create-wireflow
      - audit-conversion

  - id: cro-persuasion
    name: Convert
    file: agents/cro-persuasion.md
    role: "Padroes de conversao — comparison tables, social proof, scarcity, risk reversal, sticky bars"
    tasks:
      - audit-conversion

  - id: interaction-designer
    name: Pulse
    file: agents/interaction-designer.md
    role: "Hover states, micro-interactions, feedback loops, custom cursors, prefers-reduced-motion"
    tasks:
      - specify-motion-system

  - id: accessibility-guardian
    name: Shield
    file: agents/accessibility-guardian.md
    role: "WCAG AAA, prefers-reduced-motion, contraste, HTML semantico, keyboard nav, ARIA, focus"
    tasks:
      - validate-against-pillars

  # ═══════════════════════════════════════════════════════════════════════════
  # v2.0 EXPANSION (4 agents — Platform / SaaS / Premium Packaging)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: product-surface-director
    name: Axiom
    file: agents/product-surface-director.md
    role: "Art direction de surfaces logadas — dashboards, empty states, data density, dark mode parity, choreographia de onboarding. Pilar 8."
    tasks:
      - design-product-surface
      - first-5-minutes-choreography

  - id: design-system-architect
    name: Atlas
    file: agents/design-system-architect.md
    role: "Multi-surface design system — canonical tokens, surface dialects, semver, ownership, quarterly drift audit. Pilar 9."
    tasks:
      - design-token-system
      - audit-drift-multi-surface

  - id: platform-aesthetic-director
    name: Vertex
    file: agents/platform-aesthetic-director.md
    role: "Custodiante do canon de SaaS premium (Linear/Vercel/Stripe/Framer/Arc/Raycast). Lens nos Pilares 8, 9, 10. Previne commodity contamination."
    tasks:
      - consult-saas-canon

  - id: premium-packaging-strategist
    name: Aura
    file: agents/premium-packaging-strategist.md
    role: "Traduz 'cobrar 3x mais' em decisoes estheticas concretas. Aplica os 5 principios nao-negociaveis. Pilar 10."
    tasks:
      - create-premium-packaging-brief
      - first-5-minutes-choreography

