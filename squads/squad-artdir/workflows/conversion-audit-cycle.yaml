name: conversion-audit-cycle
version: "1.0.0"
description: >
  Auditoria de conversao de site/LP existente com diagnostico contra os 7 pilares,
  audit de padroes CRO, e recomendacoes priorizadas por impacto/esforco.

trigger: audit_request | cross_squad_request

phases:
  - id: diagnose
    name: "Diagnostico Visual"
    agent: visual-strategist
    task: diagnose-visual-language
    description: "Analisa a linguagem visual atual contra os 7 pilares"
    inputs:
      - url
      - audience
      - category
      - objective
    outputs:
      - diagnostic_report
      - pillar_scores
      - top_gaps

  - id: audit-cro
    name: "Auditoria CRO"
    agent: cro-persuasion
    task: audit-conversion
    description: "Audita padroes de conversao e identifica gaps"
    depends_on: [diagnose]
    inputs:
      - url
      - objective
      - audience
      - current_metrics (optional)
    outputs:
      - audit_report
      - dimension_scores
      - recommendations
      - quick_wins

  - id: synthesize
    name: "Sintese e Priorizacao"
    agent: artdir-orqx
    description: "Consolida diagnostico visual + audit CRO em relatorio unico priorizado"
    depends_on: [diagnose, audit-cro]
    inputs:
      - diagnostic_report
      - audit_report
      - pillar_scores
      - dimension_scores
    outputs:
      - consolidated_report
      - prioritized_actions
      - quick_wins_final
    sub_routing:
      - ia-architect: IA recommendations
      - accessibility-guardian: WCAG gaps

  - id: recommend
    name: "Recomendacoes de Art Direction"
    agent: artdir-orqx
    description: "Produz recomendacoes de art direction para corrigir os gaps"
    depends_on: [synthesize]
    condition: "overall_score < 7 OR client requests full brief"
    inputs:
      - consolidated_report
      - prioritized_actions
    outputs:
      - art_direction_recommendations
      - before_after_descriptions
      - impact_hypotheses

quality_gates:
  - every_recommendation_has_impact_hypothesis: true
  - every_recommendation_has_effort_estimate: true
  - quick_wins_are_actionable_in_1_day: true
  - scores_are_justified: true
