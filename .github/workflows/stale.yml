name: Manage Stale Issues

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          # Issue configuration
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'status: stale'
          stale-issue-message: 'Esta issue esta inativa ha 30 dias. Sera fechada em 7 dias se nao houver atividade.'
          close-issue-message: |
            Esta issue foi fechada automaticamente por inatividade.
            Se ainda for relevante, reabra com contexto adicional.
          close-issue-reason: 'not_planned'

          # PR configuration
          days-before-pr-stale: 45
          days-before-pr-close: -1
          stale-pr-label: 'status: stale'
          stale-pr-message: 'Este PR esta inativo ha 45 dias. Considere atualizar ou fechar.'

          # Exemptions
          exempt-issue-labels: 'priority: P1,priority: P2,status: in-progress,status: confirmed'
          exempt-pr-labels: 'priority: P1,priority: P2,status: in-progress'
          exempt-all-assignees: true
          exempt-draft-pr: true

          # Behavior
          remove-stale-when-updated: true
          operations-per-run: 30
