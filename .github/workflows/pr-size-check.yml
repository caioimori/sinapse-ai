name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions -q '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions -q '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "PR #${{ github.event.pull_request.number }}: +$ADDITIONS -$DELETIONS ($TOTAL total)"

          if [ "$ADDITIONS" -gt 400 ]; then
            echo "::notice::Large PR ($ADDITIONS additions). Consider splitting for faster review."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
