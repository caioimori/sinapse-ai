name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          ADDITIONS=$(gh pr view "$PR_NUMBER" --json additions -q '.additions')
          DELETIONS=$(gh pr view "$PR_NUMBER" --json deletions -q '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "PR #${PR_NUMBER}: +$ADDITIONS -$DELETIONS ($TOTAL total)"

          if [ "$ADDITIONS" -gt 400 ]; then
            echo "::notice::Large PR ($ADDITIONS additions). Consider splitting for faster review."
          fi
