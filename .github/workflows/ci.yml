name: CI
# Story 6.1: GitHub Actions Cost Optimization
# Story TD-3: CI/CD Optimization & Test Coverage
# Issue #182: Docs-only PRs no longer need a separate skip workflow
# Consolidated CI workflow - single source of truth for validation
# Uses dorny/paths-filter for job-level skipping (docs-only PRs skip all jobs gracefully)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # Required by dorny/paths-filter to access PR diff

jobs:
  # Path-based change detection for smart job skipping
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
      config: ${{ steps.filter.outputs.config }}
      stories: ${{ steps.filter.outputs.stories }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # NOTE: No 'submodules' parameter — pro/ submodule is intentionally
      # NOT checked out. sinapse-ai MUST work standalone without pro/.
      # See ADR-PRO-001 and Story PRO-5 (AC-7).
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '.sinapse-ai/**'
              - 'bin/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tools/**'
            tests:
              - 'tests/**'
              - 'jest.config.js'
            config:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.eslintrc.*'
              - 'eslint.config.*'
            stories:
              - 'docs/stories/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  # Security audit - only fail on critical vulnerabilities
  # Note: high severity vulnerabilities in dev dependencies (semantic-release/npm/tar)
  # are accepted as they don't affect production users
  security-audit:
    name: Security Audit
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit — production deps (HIGH blocks)
        run: |
          echo "=== npm audit --omit=dev --audit-level=high ==="
          # Article X Tier 1 #7: HIGH/CRITICAL in production deps is a hard block.
          # Production deps are what users receive via `npx sinapse-ai install`.
          npm audit --omit=dev --audit-level=high || {
            echo ""
            echo "❌ HIGH or CRITICAL vulnerability found in PRODUCTION deps."
            echo "This blocks merge. Run 'npm audit --omit=dev' locally for details."
            echo "Fix via 'overrides' in package.json or by bumping the offending direct dep."
            exit 1
          }
          echo "✅ No HIGH/CRITICAL vulnerabilities in production deps"

      - name: Run security audit — full tree (CRITICAL blocks)
        run: |
          echo "=== npm audit --audit-level=critical (full tree incl. dev) ==="
          # CRITICAL anywhere — even in dev deps — blocks merge.
          # HIGH/MODERATE in dev deps is governed by docs/security/dependabot-triage.md.
          npm audit --audit-level=critical || {
            echo ""
            echo "❌ CRITICAL vulnerability found."
            echo "Run 'npm audit' locally for details."
            exit 1
          }
          echo "✅ No CRITICAL vulnerabilities in full tree"

  # Secret scanning - detect leaked secrets in codebase
  secret-scanning:
    name: Secret Scanning
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: ESLint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Type Checking
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

  test:
    name: Jest Tests (Node ${{ matrix.node }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Node 18 removed 2026-05-04 [health-check audit CI-2]: EOL since April 2025.
        # Active LTS only: 20, 22, 24. cross-platform job (main-only) still runs 18 for
        # broader compat smoke. Re-add 18 to PR matrix when external user reports breakage.
        # Node 25 removed 2026-04-12 [Story 10.14]: not LTS.
        node: ['20', '22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage Report (Story 10.25)
        # Coverage gating is enforced by jest.config.js coverageThreshold
        # (Story 10.19 ratchet). This step prints actual numbers vs floors
        # for visibility and writes a Markdown table to the GitHub Actions
        # job summary so PR reviewers see coverage at a glance.
        run: node scripts/coverage-report-summary.js

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  story-validation:
    name: Story Checkbox Validation
    needs: changes
    if: ${{ needs.changes.outputs.stories == 'true' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate story checkboxes
        run: node .sinapse-ai/utils/sinapse-validator.js stories

  manifest-validation:
    name: Install Manifest Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate manifest (ensures parity with source files)
        run: npm run generate:manifest

      - name: Validate install manifest
        run: npm run validate:manifest

  ide-sync-validation:
    name: IDE Command Sync Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run IDE sync (ensures parity before check)
        run: npm run sync:ide || true

      - name: Validate IDE sync
        run: npm run sync:ide:check

      - name: Report on failure
        if: failure()
        run: |
          echo "::error::IDE command files out of sync"
          echo "Run 'npm run sync:ide' locally and commit"
          npm run sync:ide:validate

  compatibility-parity-gate:
    name: Compatibility Parity Gate
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility parity gate
        run: |
          npm run generate:manifest
          npm run validate:parity

  semantic-lint:
    name: Semantic Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.stories == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run semantic lint
        run: npm run validate:semantic-lint

  # Story 10.13 — Canonical install command guard. Fails if any public
  # install doc references a non-canonical command (e.g. `sinapse install`
  # without `-ai`, or the internal `install-squads.sh` script).
  install-docs-validation:
    name: Install Docs Validation
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical install commands in docs
        run: npm run validate:docs

  # Story 10.17 — Authorial Hygiene & Competitive Reference Guard. Fails if
  # any committed file (outside the hardcoded allow-list of LICENSE and
  # docs/research-synthesis-for-upgrade.md) contains a reference to a
  # competing framework. Keeps the SINAPSE codebase in 100% authorial voice.
  external-refs-validation:
    name: External References Validation
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate no external framework references
        run: node scripts/validate-no-external-refs.js

  # Deep-audit 2026-05-05: broken markdown links monitoring (WARN, non-blocking).
  # 523 broken links existem hoje (legacy de varias reorganizacoes).
  # Story `docs-broken-links-triage` cobre o cleanup completo. Este job evita
  # REGRESSAO (PRs nao podem aumentar o numero de broken links sem awareness).
  markdown-links-monitor:
    name: Markdown Links Monitor (WARN)
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true  # NON-BLOCKING — informational only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check broken markdown links
        run: |
          python scripts/check-markdown-links.py 2>&1 | tee links-report.txt
          BROKEN=$(grep -oP 'Broken links \(ACTION: mark coming soon\): \K\d+' links-report.txt || echo 0)
          BASELINE=523  # captured 2026-05-05 in deep-audit
          echo ""
          echo "=== Markdown Links Monitor ==="
          echo "Current broken: $BROKEN"
          echo "Baseline (2026-05-05): $BASELINE"
          if [ "$BROKEN" -gt "$BASELINE" ]; then
            echo "::warning::Broken links increased ($BROKEN > $BASELINE). Please fix or update baseline if intentional."
          else
            echo "✅ No regression"
          fi

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [changes, security-audit, secret-scanning, lint, typecheck, test, story-validation, manifest-validation, ide-sync-validation, installer-smoke-test, compatibility-parity-gate, dependency-validation, brownfield-install-test, install-docs-validation, external-refs-validation]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "=== SINAPSE CI Validation Summary ==="
          echo ""
          echo "📋 Change Detection:"
          echo "  Code changed: ${{ needs.changes.outputs.code }}"
          echo "  Tests changed: ${{ needs.changes.outputs.tests }}"
          echo "  Config changed: ${{ needs.changes.outputs.config }}"
          echo "  Stories changed: ${{ needs.changes.outputs.stories }}"
          echo "  Docs changed: ${{ needs.changes.outputs.docs }}"
          echo ""
          echo "📊 Job Results:"
          echo "  Security Audit: ${{ needs.security-audit.result }}"
          echo "  Secret Scanning: ${{ needs.secret-scanning.result }}"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  TypeCheck: ${{ needs.typecheck.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Story Validation: ${{ needs.story-validation.result }}"
          echo "  Manifest Validation: ${{ needs.manifest-validation.result }}"
          echo "  IDE Sync Validation: ${{ needs.ide-sync-validation.result }}"
          echo "  Installer Smoke Test: ${{ needs.installer-smoke-test.result }}"
          echo "  Dependency Validation: ${{ needs.dependency-validation.result }}"
          echo "  Brownfield Install Test: ${{ needs.brownfield-install-test.result }}"
          echo "  Install Docs Validation: ${{ needs.install-docs-validation.result }}"
          echo "  External Refs Validation: ${{ needs.external-refs-validation.result }}"
          echo ""

          # Check for failures (skipped is OK when changes don't affect that area)
          FAILED=false

          # Security Audit: fail if ran and didn't succeed
          if [ "${{ needs.security-audit.result }}" == "failure" ]; then
            echo "❌ Security audit failed (critical vulnerabilities found)"
            FAILED=true
          fi

          # Secret Scanning: fail if ran and didn't succeed
          if [ "${{ needs.secret-scanning.result }}" == "failure" ]; then
            echo "❌ Secret scanning failed (leaked secrets detected)"
            FAILED=true
          fi

          # Lint: fail if ran and didn't succeed
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "❌ ESLint check failed"
            FAILED=true
          fi

          # TypeCheck: fail if ran and didn't succeed
          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "❌ TypeScript check failed"
            FAILED=true
          fi

          # Tests: fail if ran and didn't succeed
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Jest tests failed"
            FAILED=true
          fi

          # Story Validation: fail if ran and didn't succeed
          if [ "${{ needs.story-validation.result }}" == "failure" ]; then
            echo "❌ Story validation failed"
            FAILED=true
          fi

          # Manifest Validation: fail if ran and didn't succeed
          if [ "${{ needs.manifest-validation.result }}" == "failure" ]; then
            echo "❌ Manifest validation failed"
            FAILED=true
          fi

          # IDE Sync: fail if ran and didn't succeed
          if [ "${{ needs.ide-sync-validation.result }}" == "failure" ]; then
            echo "❌ IDE sync validation failed"
            FAILED=true
          fi

          # Installer Smoke Test: fail if ran and didn't succeed
          if [ "${{ needs.installer-smoke-test.result }}" == "failure" ]; then
            echo "❌ Installer smoke test failed - WRONG WIZARD MAY BE USED!"
            FAILED=true
          fi

          # Dependency Validation (INS-4.12): fail if ran and didn't succeed
          if [ "${{ needs.dependency-validation.result }}" == "failure" ]; then
            echo "❌ Dependency validation failed - .sinapse-ai/package.json incomplete"
            FAILED=true
          fi

          # Brownfield Install Test (INS-4.12): fail if ran and didn't succeed
          if [ "${{ needs.brownfield-install-test.result }}" == "failure" ]; then
            echo "❌ Brownfield install test failed - brownfield users will see errors"
            FAILED=true
          fi

          # Install Docs Validation (Story 10.13): fail if ran and didn't succeed
          if [ "${{ needs.install-docs-validation.result }}" == "failure" ]; then
            echo "❌ Install docs validation failed - non-canonical install command referenced in public docs"
            FAILED=true
          fi

          # External References Validation (Story 10.17): fail if ran and didn't succeed
          if [ "${{ needs.external-refs-validation.result }}" == "failure" ]; then
            echo "❌ External references validation failed - competing framework reference detected outside allow-list"
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "❌ One or more validation checks failed"
            exit 1
          fi

          echo "✅ All validation checks passed (skipped jobs are OK when no relevant changes)"

  # Performance monitoring (optional, informational only)
  performance:
    name: Performance Metrics
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Measure validation performance
        run: |
          echo "=== Validation Performance Metrics ==="

          echo "ESLint execution time:"
          time npm run lint || true

          echo -e "\nTypeScript execution time:"
          time npm run typecheck || true

          echo -e "\nStory validation time:"
          time node .sinapse-ai/utils/sinapse-validator.js stories || true
        continue-on-error: true

  # SYNAPSE context engine benchmarks + E2E tests (Story SYN-12)
  synapse-benchmark:
    name: SYNAPSE Benchmark (Node ${{ matrix.node }})
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Matches test matrix [health-check CI-2]. cross-platform keeps full range.
        node: ['20', '22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run SYNAPSE E2E tests
        run: npx jest tests/synapse/e2e/ --ci --verbose
        continue-on-error: true

      - name: Run SYNAPSE pipeline benchmark
        run: node tests/synapse/benchmarks/pipeline-benchmark.js --iterations=50 --json
        continue-on-error: true

  # Cross-platform testing - ONLY on main branch push
  # Moved from cross-platform-tests.yml (Story 6.1)
  cross-platform:
    name: Cross-Platform (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [changes, lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
        # All combinations supported for Node.js 18-24 (isolated-vm removed in v3.11.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test CLI installation
        run: npm link
        continue-on-error: true

      - name: Test CLI basic commands
        run: |
          npx sinapse-ai --version || echo "CLI version check skipped"
          npx sinapse-ai --help || echo "CLI help check skipped"
        continue-on-error: true

  # Pre-merge cross-platform smoke — runs the full suite on macOS + Windows on
  # EVERY PR so OS-only breakage (path separators, case-sensitivity,
  # child_process/.cmd shims, shell pipelines) is caught BEFORE merge, not only
  # by the post-merge `cross-platform` job. Kept to a single Node to cap cost;
  # the main-push `cross-platform` job remains the full OS x Node backstop.
  cross-platform-pr:
    name: Cross-Platform PR Smoke (${{ matrix.os }})
    needs: [changes, lint, typecheck]
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.config == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # INS-4.12: Dependency graph validation — ensures .sinapse-ai/package.json is complete
  dependency-validation:
    name: Dependency Validation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate .sinapse-ai dependency completeness
        run: node scripts/validate-sinapse-ai-deps.js

  # INS-4.12: Brownfield install test — simulates npm install in existing project
  brownfield-install-test:
    name: Brownfield Install Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pack sinapse-ai
        run: npm pack

      - name: Create brownfield test project
        run: |
          mkdir -p /tmp/brownfield-test
          cd /tmp/brownfield-test
          npm init -y

      - name: Install sinapse-ai in brownfield project
        run: |
          cd /tmp/brownfield-test
          TARBALL=$(ls ${{ github.workspace }}/sinapse-ai-*.tgz)
          npm install "$TARBALL"

      - name: Verify .sinapse-ai dependencies installable
        run: |
          cd /tmp/brownfield-test
          SINAPSE_CORE_DIR="node_modules/sinapse-ai/.sinapse-ai"
          if [ -f "$SINAPSE_CORE_DIR/package.json" ]; then
            cd "$SINAPSE_CORE_DIR"
            npm install --production --ignore-scripts
            echo "✅ .sinapse-ai dependencies installed successfully"
          else
            echo "⚠️ .sinapse-ai/package.json not found in installed package"
            exit 1
          fi

      - name: Verify key modules resolvable
        run: |
          cd /tmp/brownfield-test
          SINAPSE_NODE_MODULES="node_modules/sinapse-ai/.sinapse-ai/node_modules"
          MISSING=0

          for pkg in fast-glob fs-extra js-yaml semver ajv tar chalk; do
            if [ -d "$SINAPSE_NODE_MODULES/$pkg" ]; then
              echo "✅ $pkg found in .sinapse-ai/node_modules/"
            else
              echo "❌ $pkg MISSING from .sinapse-ai/node_modules/"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "FAIL: Some required modules are missing"
            exit 1
          fi

          echo ""
          echo "✅ All key modules resolvable in brownfield context"

  # Installer smoke test - ensures correct wizard is being used (Story 6.1.4)
  installer-smoke-test:
    name: Installer Smoke Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify wizard path in sinapse.js
        run: |
          echo "=== Installer Smoke Test ==="
          echo ""
          echo "Checking bin/sinapse.js uses correct wizard path..."

          # The wizard path should point to packages/installer/src/wizard/index.js
          if grep -q "packages.*installer.*src.*wizard" bin/sinapse.js; then
            echo "✅ bin/sinapse.js uses correct wizard path (packages/installer/src/wizard)"
          else
            echo "❌ ERROR: bin/sinapse.js does NOT reference packages/installer/src/wizard"
            echo ""
            echo "Current wizard references in bin/sinapse.js:"
            grep -n "wizard" bin/sinapse.js || echo "No wizard references found"
            echo ""
            echo "This is a CRITICAL error - wrong installer will be used!"
            exit 1
          fi

      - name: Verify wizard file exists
        run: |
          echo "Checking wizard file exists..."

          if [ -f "packages/installer/src/wizard/index.js" ]; then
            echo "✅ packages/installer/src/wizard/index.js exists"
          else
            echo "❌ ERROR: packages/installer/src/wizard/index.js NOT FOUND"
            echo ""
            echo "Files in packages/installer/src/:"
            ls -la packages/installer/src/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

      - name: Verify sinapse-minimal.js uses router
        run: |
          echo "Checking bin/sinapse-minimal.js uses main router..."

          if grep -q "sinapse\.js" bin/sinapse-minimal.js; then
            echo "✅ bin/sinapse-minimal.js forwards to sinapse.js router"
          else
            echo "⚠️  WARNING: bin/sinapse-minimal.js may not use the main router"
            echo ""
            echo "Current content:"
            cat bin/sinapse-minimal.js
          fi

      - name: Verify package.json files field
        run: |
          echo "Checking package.json includes all required paths..."

          # Check for required paths in files field
          REQUIRED_PATHS=("bin/" "packages/" ".sinapse-ai/")

          for path in "${REQUIRED_PATHS[@]}"; do
            if grep -q "\"$path\"" package.json; then
              echo "✅ package.json includes $path"
            else
              echo "❌ ERROR: package.json missing $path in files field"
              exit 1
            fi
          done

      - name: Summary
        run: |
          echo ""
          echo "=== Installer Smoke Test Complete ==="
          echo "✅ All installer checks passed"
          echo ""
          echo "The npm publish will use the correct wizard from:"
          echo "  packages/installer/src/wizard/index.js"
