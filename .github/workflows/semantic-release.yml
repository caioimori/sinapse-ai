name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: false
        default: true
        type: boolean

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish Prepared Release
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release readiness
        run: npm run validate:release-readiness

      - name: Publish safety gate (INS-4.10)
        run: npm run validate:publish

      - name: Verify version and changelog preparation
        run: node scripts/prepare-release.mjs --check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Verify npm authentication
        if: ${{ inputs.dry_run == false }}
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Preview release
        if: ${{ inputs.dry_run == true }}
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish release
        if: ${{ inputs.dry_run == false }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Isolated public smoke test
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=""
          for ATTEMPT in $(seq 1 12); do
            PUBLISHED_VERSION=$(npm view "sinapse-ai@${VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              break
            fi
            echo "Waiting for npm registry propagation (${ATTEMPT}/12)..."
            sleep $((ATTEMPT * 5))
          done
          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "sinapse-ai@${VERSION} was not observable in the npm registry after polling."
            exit 1
          fi

          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/project" "$ROOT/home" "$ROOT/cache"
          cd "$ROOT/project"
          HOME="$ROOT/home" \
          npm_config_cache="$ROOT/cache" \
          CI=true \
          npx --yes "sinapse-ai@${VERSION}" install
          test -f .claude/CLAUDE.md
          test -f AGENTS.md
          test -d .agents/skills

      - name: Summary
        if: ${{ always() }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          echo "## Semantic Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`$RELEASE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: \`$RELEASE_DRY_RUN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$RELEASE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
