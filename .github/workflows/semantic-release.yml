name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: false
        default: true
        type: boolean

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish Prepared Release
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release readiness
        run: npm run validate:release-readiness

      - name: Publish safety gate (INS-4.10)
        run: npm run validate:publish

      - name: Verify version and changelog preparation
        run: node scripts/prepare-release.mjs --check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Verify npm authentication
        if: ${{ inputs.dry_run == false }}
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Preview release
        if: ${{ inputs.dry_run == true }}
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish release
        if: ${{ inputs.dry_run == false }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Isolated public smoke test
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/project" "$ROOT/home" "$ROOT/cache"
          cd "$ROOT/project"
          HOME="$ROOT/home" \
          npm_config_cache="$ROOT/cache" \
          CI=1 \
          npx --yes "sinapse-ai@${VERSION}" install
          test -f .claude/CLAUDE.md
          test -f AGENTS.md
          test -d .agents/skills

      - name: Summary
        if: ${{ always() }}
        run: |
          echo "## Semantic Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
