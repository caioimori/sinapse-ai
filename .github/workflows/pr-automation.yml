name: PR Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      summary: ${{ steps.coverage.outputs.summary }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Extract coverage summary
        id: coverage
        shell: bash
        run: |
          test -f coverage/coverage-summary.json
          LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
          BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
          FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
          echo "summary=Lines ${LINES}% | Statements ${STATEMENTS}% | Branches ${BRANCHES}% | Functions ${FUNCTIONS}%" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: sinapse-ai
          fail_ci_if_error: false

  comment:
    name: Publish Coverage Summary
    needs: coverage
    if: ${{ always() && needs.coverage.result == 'success' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or update comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COVERAGE_SUMMARY: ${{ needs.coverage.outputs.summary }}
        with:
          script: |
            const marker = '<!-- sinapse-coverage -->';
            const body = `${marker}\n## Coverage\n\n${process.env.COVERAGE_SUMMARY}\n\n[Open the Codecov report](https://codecov.io/gh/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const current = comments.find((item) =>
              item.user.type === 'Bot' && item.body.includes(marker)
            );
            if (current) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: current.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
