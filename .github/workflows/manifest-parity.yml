name: Manifest Parity
# Story A.4 — Install Manifest Parity & Regeneration
#
# Blocks PRs that would land install-manifest.yaml / entity-registry.yaml
# drift against the real files under .sinapse-ai/development/.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: manifest-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Validate install-manifest parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies (root only, no workspaces)
        run: npm ci --no-audit --no-fund --ignore-scripts --workspaces=false

      - name: Run parity check
        run: npm run validate:manifest:parity
