name: Constitution Article Gates

# Story GA-1.5 — Article gates VII/VIII/XI automated
#
# Three independent jobs that block merge on Constitution violations:
#   - Article VII  (Metrics Accuracy)     — always
#   - Article VIII (Mandatory Delegation) — always
#   - Article XI   (Conservative Default) — only on PRs (compares against base)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: article-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  article-vii:
    name: Article VII (Metrics Accuracy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate metrics consistency
        run: npm run validate:article-vii

  article-viii:
    name: Article VIII (Mandatory Delegation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate orchestrator delegation
        run: npm run validate:article-viii

  article-xi:
    name: Article XI (Conservative Default)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate protected-path deletions
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run validate:article-xi
