name: Install Matrix (A.5 Gate)
run-name: Install Matrix — ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
# Story A.5 - Windows Wrapper & Cross-Platform Test Matrix
# Runs the 24-combo install validation grid:
#   (Windows 11 / macOS latest / Ubuntu 22.04) x (npm / pnpm / yarn) x (global / npx+dlx / local)
#   MINUS 3 combos: Windows x yarn v1 x * (documented platform exception since 2026-04-16)
# GATE: all 24 required combos MUST pass before rc -> latest promotion.
#
# Why Yarn v1 Windows is excluded: Yarn v1 (classic) is in maintenance mode
# since 2020 with Yarn Berry (v2+) as successor. Yarn v1's `file:` protocol
# does not create `.bin` symlinks correctly on Windows. Windows users should
# use npm, pnpm, or Yarn v2+. Decision record: docs/audits/install-matrix-2026-04-16.md

on:
  pull_request:
    branches:
      - main
    types: [labeled]
  # Allow manual dispatch for ad-hoc runs by @devops
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string

concurrency:
  group: install-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  # The package no longer ships an npm `postinstall` hook (removed 2026-06 for
  # supply-chain safety; setup is explicit via `npx sinapse-ai install`). This
  # var only affects the opt-in `npm run setup` path now.
  SINAPSE_SKIP_POSTINSTALL: '0'
  # Prevent husky from running during npm pack / install in CI (husky v9 respects this).
  HUSKY: '0'

jobs:
  validate-candidate:
    name: Validate Install Matrix candidate SHA
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact candidate SHA
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$TESTED_HEAD_SHA" = "$DISPATCH_SHA"
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TESTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TESTED_HEAD_SHA"

  install-matrix:
    name: ${{ matrix.os }} / ${{ matrix.pm }} / ${{ matrix.method }}
    needs: validate-candidate
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        pm: [npm, pnpm, yarn]
        method: [global, npx, local]
        # Platform exception: Yarn v1 classic on Windows is unsupported.
        # See header comment for rationale. 24 combos run, not 27.
        exclude:
          - os: windows-latest
            pm: yarn
            method: global
          - os: windows-latest
            pm: yarn
            method: npx
          - os: windows-latest
            pm: yarn
            method: local
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TESTED_HEAD_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ----------------------------------------------------------------
      # Build a tarball of the current repo so every combo installs the
      # EXACT candidate, not a published version.
      # ----------------------------------------------------------------
      - name: Pack candidate tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # Strip the prepare script (husky) before packing — husky is a
          # devDependency not installed in the CI checkout, and consumers
          # don't need it. The tarball keeps postinstall intact.
          npm pkg delete scripts.prepare
          npm pack --ignore-scripts --silent > /dev/null
          TARBALL=$(ls sinapse-ai-*.tgz | head -n1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "abs_path=$(pwd)/$TARBALL" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Install package managers that are not npm.
      # ----------------------------------------------------------------
      - name: Install pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - name: Install yarn (classic)
        if: matrix.pm == 'yarn'
        shell: bash
        run: |
          test "$(npm view yarn@1.22.22 version)" = "1.22.22"
          npm install --global yarn@1.22.22

      # ----------------------------------------------------------------
      # Create an isolated install directory so nothing from the repo
      # interferes with the combo under test.
      # ----------------------------------------------------------------
      - name: Create isolated test dir
        id: isolate
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="$RUNNER_TEMP/install-matrix-${{ matrix.pm }}-${{ matrix.method }}"
          mkdir -p "$TEST_DIR"
          echo "dir=$TEST_DIR" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Run the install + 4 checks via the helper script.
      # The script outputs to $GITHUB_STEP_SUMMARY and exits non-zero on
      # any failed check, which fails this matrix cell.
      # ----------------------------------------------------------------
      - name: Run install combo and checks (bash)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SM_PM: ${{ matrix.pm }}
          SM_METHOD: ${{ matrix.method }}
          SM_TARBALL: ${{ steps.pack.outputs.abs_path }}
          SM_TEST_DIR: ${{ steps.isolate.outputs.dir }}
        run: |
          bash .github/workflows/install-matrix/run-combo.sh

      - name: Run install combo and checks (Windows bash)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SM_PM: ${{ matrix.pm }}
          SM_METHOD: ${{ matrix.method }}
          SM_TARBALL: ${{ steps.pack.outputs.abs_path }}
          SM_TEST_DIR: ${{ steps.isolate.outputs.dir }}
        run: |
          bash .github/workflows/install-matrix/run-combo.sh

      - name: Annotate cell result
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          COMBO="${{ matrix.os }} / ${{ matrix.pm }} / ${{ matrix.method }}"
          if [ "$STATUS" = "success" ]; then
            echo "::notice title=Matrix cell PASS::$COMBO"
          else
            echo "::error title=Matrix cell FAIL::$COMBO"
          fi

  provider-install-matrix:
    name: Provider payload / ${{ matrix.provider }}
    needs: validate-candidate
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [claude-code, codex, both]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TESTED_HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pack and install candidate
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete scripts.prepare
          npm pack --ignore-scripts --silent >/dev/null
          TARBALL=$(pwd)/$(ls sinapse-ai-*.tgz | head -n1)
          TEST_DIR="$RUNNER_TEMP/provider-${{ matrix.provider }}"
          mkdir -p "$TEST_DIR/project"
          cd "$TEST_DIR"
          npm init -y >/dev/null
          npm install "$TARBALL" --ignore-scripts --no-audit --no-fund >/dev/null
          node "$GITHUB_WORKSPACE/.github/workflows/install-matrix/run-provider-mode.js" \
            "${{ matrix.provider }}" "$TEST_DIR/project" "$TEST_DIR/node_modules/sinapse-ai"

  provider-upgrade-matrix:
    name: Public latest upgrade / ${{ matrix.provider }}
    needs: validate-candidate
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [claude-code, codex, both]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TESTED_HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install public latest, then upgrade from candidate tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete scripts.prepare
          npm pack --ignore-scripts --silent >/dev/null
          TARBALL=$(pwd)/$(ls sinapse-ai-*.tgz | head -n1)
          TEST_DIR="$RUNNER_TEMP/upgrade-${{ matrix.provider }}"
          mkdir -p "$TEST_DIR/project" "$TEST_DIR/host"
          cd "$TEST_DIR/host"
          npm init -y >/dev/null
          npm install sinapse-ai@latest --ignore-scripts --no-audit --no-fund >/dev/null
          node -e "require('./node_modules/sinapse-ai/packages/installer/src/installer/sinapse-ai-installer').installSinapseCore({targetDir:process.argv[1]}).then(r=>{if(!r.success)process.exit(1)})" "$TEST_DIR/project"
          npm install "$TARBALL" --ignore-scripts --no-audit --no-fund >/dev/null
          node "$GITHUB_WORKSPACE/.github/workflows/install-matrix/run-provider-mode.js" \
            "${{ matrix.provider }}" "$TEST_DIR/project" "$TEST_DIR/host/node_modules/sinapse-ai"

  summary:
    name: Gate Summary (24 combos + 3 clean + 3 upgrades)
    needs: [validate-candidate, install-matrix, provider-install-matrix, provider-upgrade-matrix]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          echo "Tested head SHA: $TESTED_HEAD_SHA"
          echo "## Install Matrix evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tested head SHA: \`$TESTED_HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          RESULT="${{ needs.install-matrix.result }}"
          PROVIDERS="${{ needs.provider-install-matrix.result }}"
          UPGRADES="${{ needs.provider-upgrade-matrix.result }}"
          echo "Install Matrix aggregate result: $RESULT"
          echo "Provider Matrix aggregate result: $PROVIDERS"
          echo "Provider Upgrade aggregate result: $UPGRADES"
          if [ "$RESULT" != "success" ] || [ "$PROVIDERS" != "success" ] || [ "$UPGRADES" != "success" ]; then
            echo "::error title=Install Matrix GATE FAIL::One or more required combos failed. rc CANNOT be promoted to latest until all 24 required combos pass. (3 Yarn v1 Windows combos are excluded as platform exception — see docs/audits/install-matrix-2026-04-16.md.)"
            exit 1
          fi
          echo "::notice title=Install Matrix GATE PASS::All 24 required combos, 3 clean provider installs, and 3 public-latest upgrades PASS. rc may be promoted to latest."
