name: macOS Testing & Validation
# Story 1.10b - Automated macOS testing across Intel and Apple Silicon
# Story 6.1 - Added concurrency, normalized branches

on:
  push:
    branches: [main]
    paths:
      - 'packages/installer/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/macos/**'
      - '.github/workflows/macos-testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/installer/**'
      - 'bin/**'
      - 'scripts/**'
      - 'tests/macos/**'
      - '.github/workflows/macos-testing.yml'
  workflow_dispatch:

concurrency:
  group: macos-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Intel Mac Testing
  test-intel-mac:
    name: Test on macOS Intel (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Display system information
        run: |
          echo "=== System Information ==="
          sw_vers
          uname -a
          echo "Architecture: $(uname -m)"
          node --version
          npm --version
          echo "=========================="

      - name: Install dependencies
        run: npm ci

      - name: Make test scripts executable
        run: chmod +x tests/macos/*.sh

      - name: Run Intel-specific tests
        run: |
          cd tests/macos
          ./test-intel-installation.sh

      - name: Run compatibility tests
        run: |
          cd tests/macos
          ./test-shell-compatibility.sh
          ./test-path-handling.sh
          ./test-line-endings.sh
          ./test-permissions.sh

      - name: Run integration tests
        run: |
          cd tests/macos
          ./test-homebrew-integration.sh

      - name: Run performance benchmarks
        run: |
          cd tests/macos
          ./test-performance.sh

      - name: Run security tests
        run: |
          cd tests/macos
          ./test-security.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-intel
          path: /tmp/sinapse-test-*.log
          retention-days: 30

  # Job 2: Apple Silicon Testing
  test-apple-silicon:
    name: Test on macOS Apple Silicon (arm64)
    runs-on: macos-14  # M1 runner
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Display system information
        run: |
          echo "=== System Information ==="
          sw_vers
          uname -a
          echo "Architecture: $(uname -m)"
          sysctl -n machdep.cpu.brand_string
          node --version
          npm --version
          file $(which node)
          echo "=========================="

      - name: Install dependencies
        run: npm ci

      - name: Make test scripts executable
        run: chmod +x tests/macos/*.sh

      - name: Run Apple Silicon-specific tests
        run: |
          cd tests/macos
          ./test-apple-silicon-installation.sh

      - name: Run compatibility tests
        run: |
          cd tests/macos
          ./test-shell-compatibility.sh
          ./test-path-handling.sh
          ./test-line-endings.sh
          ./test-permissions.sh

      - name: Run integration tests
        run: |
          cd tests/macos
          ./test-homebrew-integration.sh

      - name: Run performance benchmarks
        run: |
          cd tests/macos
          ./test-performance.sh

      - name: Run security tests
        run: |
          cd tests/macos
          ./test-security.sh

      - name: Verify native ARM execution
        run: |
          echo "Checking if Node.js runs natively on ARM..."
          file $(which node) | grep arm64 || echo "WARNING: Node.js not running natively on ARM"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-apple-silicon
          path: /tmp/sinapse-test-*.log
          retention-days: 30

  # Job 3: Error Recovery Testing
  test-error-recovery:
    name: Test Error Recovery & Rollback
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Make test scripts executable
        run: chmod +x tests/macos/*.sh

      - name: Run error recovery tests
        run: |
          cd tests/macos
          ./test-error-recovery.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-error-recovery
          path: /tmp/sinapse-test-*.log
          retention-days: 30

  # Job 4: Generate Test Report
  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-intel-mac, test-apple-silicon, test-error-recovery]
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download all test logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: test-results/

      - name: Generate summary report
        run: |
          echo "# macOS Testing Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "**Date:** $(date)" >> test-summary.md
          echo "**Workflow:** ${{ github.workflow }}" >> test-summary.md
          echo "**Commit:** ${{ github.sha }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "## Test Results" >> test-summary.md
          echo "" >> test-summary.md
          echo "| Platform | Status |" >> test-summary.md
          echo "|----------|--------|" >> test-summary.md
          echo "| Intel Mac (x86_64) | ${{ needs.test-intel-mac.result }} |" >> test-summary.md
          echo "| Apple Silicon (arm64) | ${{ needs.test-apple-silicon.result }} |" >> test-summary.md
          echo "| Error Recovery | ${{ needs.test-error-recovery.result }} |" >> test-summary.md
          echo "" >> test-summary.md

          cat test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 90

      - name: Comment PR with results
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sinapse-macos-results -->';
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            const body = `${marker}\n${summary}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const current = comments.find((item) =>
              item.user.type === 'Bot' && item.body.includes(marker)
            );
            if (current) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: current.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  macos-gate:
    name: macOS Validation Gate
    runs-on: ubuntu-latest
    needs: [test-intel-mac, test-apple-silicon, test-error-recovery]
    if: always()
    env:
      INTEL_RESULT: ${{ needs.test-intel-mac.result }}
      ARM_RESULT: ${{ needs.test-apple-silicon.result }}
      RECOVERY_RESULT: ${{ needs.test-error-recovery.result }}
    steps:
      - name: Require all macOS validations
        shell: bash
        run: |
          printf 'Intel: %s\nApple Silicon: %s\nRecovery: %s\n' \
            "$INTEL_RESULT" "$ARM_RESULT" "$RECOVERY_RESULT"
          test "$INTEL_RESULT" = success
          test "$ARM_RESULT" = success
          test "$RECOVERY_RESULT" = success
