# Welcome New Contributors Workflow
# Automatically welcomes first-time contributors to SINAPSE
#
# Reference: https://github.com/actions/first-interaction
# Story: GHIM-001 - GitHub Issue Management

name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@fb2402657b4a28582200150d0a145671d0e50597 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Obrigado por abrir sua primeira issue no SINAPSE AI.

            **O que acontece agora?**
            - Um maintainer vai validar reproducao, escopo e prioridade
            - Perguntas de uso podem ser movidas para Discussions
            - Participe das [Discussoes da Comunidade](https://github.com/caioimori/sinapse-ai/discussions)

            **Recursos uteis:**
            - [Guia de Contribuicao](https://github.com/caioimori/sinapse-ai/blob/main/CONTRIBUTING.md)
            - [Documentacao](https://github.com/caioimori/sinapse-ai/tree/main/docs)

            **Quer contribuir?** Confira issues com label `good first issue`.

          pr-message: |
            Obrigado pelo seu primeiro pull request no SINAPSE AI.

            **Checklist de revisao:**
            - [ ] `npm run lint` passa sem erros
            - [ ] `npm run typecheck` passa sem erros
            - [ ] `npm test` passa sem falhas
            - [ ] Titulo segue Conventional Commits (feat:, fix:, docs:, etc.)
            - [ ] Story e evidencia de validacao estao atualizadas quando aplicavel

            Um maintainer vai revisar em breve.

      - name: Add triage label to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const labelName = 'status: needs-triage';
            const hasTriageLabel = labels.data.some(label => label.name === labelName);

            if (!hasTriageLabel) {
              const repoLabels = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              if (repoLabels.data.some(label => label.name === labelName)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [labelName]
                });
              } else {
                core.notice(`Label '${labelName}' is not configured; triage continues without it.`);
              }
            }
