# Welcome New Contributors Workflow
# Automatically welcomes first-time contributors to SINAPSE
#
# Reference: https://github.com/actions/first-interaction
# Story: GHIM-001 - GitHub Issue Management

name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Obrigado por abrir sua primeira issue no SINAPSE AI.

            **O que acontece agora?**
            - Um maintainer vai validar reprodução, escopo e prioridade
            - Perguntas de uso podem ser movidas para Discussions
            - Participe das [Discussões da Comunidade](https://github.com/caioimori/sinapse-ai/discussions)

            **Recursos úteis:**
            - [Guia de Contribuição](https://github.com/caioimori/sinapse-ai/blob/main/CONTRIBUTING.md)
            - [Documentação](https://github.com/caioimori/sinapse-ai/tree/main/docs)

            **Quer contribuir?** Confira issues com label `good first issue`.

          pr_message: |
            Obrigado pelo seu primeiro pull request no SINAPSE AI.

            **Checklist de revisão:**
            - [ ] `npm run lint` passa sem erros
            - [ ] `npm run typecheck` passa sem erros
            - [ ] `npm test` passa sem falhas
            - [ ] Título segue Conventional Commits (`feat:`, `fix:`, `docs:`, etc.)
            - [ ] Story e evidência de validação estão atualizadas quando aplicável

            Um maintainer vai revisar em breve.

      - name: Add triage label to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const LABEL_NAME = 'status: needs-triage';
            const hasTriageLabel = labels.data.some(label => label.name === LABEL_NAME);

            if (!hasTriageLabel) {
              const repoLabels = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              if (repoLabels.data.some(label => label.name === LABEL_NAME)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [LABEL_NAME]
                });
              } else {
                core.notice(`Label '${LABEL_NAME}' is not configured; triage continues without it.`);
              }
            }
