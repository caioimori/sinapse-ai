# Welcome New Contributors Workflow
# Automatically welcomes first-time contributors to SINAPSE
#
# Reference: https://github.com/actions/first-interaction
# Story: GHIM-001 - GitHub Issue Management

name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Obrigado por abrir sua primeira issue no SINAPSE-AI!

            **O que acontece agora?**
            - Um maintainer vai fazer a triagem e adicionar labels apropriadas
            - Vamos responder o mais rapido possivel
            - Participe das [Discussoes da Comunidade](https://github.com/caioimori/sinapse-ai/discussions)

            **Recursos uteis:**
            - [Guia de Contribuicao](https://github.com/caioimori/sinapse-ai/blob/main/CONTRIBUTING.md)
            - [Documentacao](https://github.com/caioimori/sinapse-ai/tree/main/docs)

            **Quer contribuir?** Confira issues com label `good first issue`.

          pr-message: |
            Obrigado pelo seu primeiro PR no SINAPSE-AI!

            **Checklist de revisao:**
            - [ ] `npm run lint` passa sem erros
            - [ ] `npm run typecheck` passa sem erros
            - [ ] `npm test` passa sem falhas
            - [ ] Commits seguem Conventional Commits (feat:, fix:, docs:, etc.)
            - [ ] PR template preenchido completamente

            Um maintainer vai revisar em breve.

      - name: Add triage label to new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const hasTriageLabel = labels.data.some(label =>
              label.name === 'status: needs-triage'
            );

            if (!hasTriageLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['status: needs-triage']
              });
            }
