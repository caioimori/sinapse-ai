name: Feature request
description: Propose a capability from a concrete user problem
title: "feat: "
labels: ["enhancement", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who has the problem, what are they trying to do, and what evidence supports it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional API, workflow, or interaction proposal.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: dropdown
    id: providers
    attributes:
      label: Provider scope
      options:
        - Claude Code and Codex
        - Claude Code only
        - Codex only
        - Provider-independent
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Additive
        - Behavior change
        - Breaking or migration required
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues, discussions, and the roadmap.
          required: true
        - label: I described a user problem and an observable outcome.
          required: true
        - label: I can help with implementation, tests, or documentation.
