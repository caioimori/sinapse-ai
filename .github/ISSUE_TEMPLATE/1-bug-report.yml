name: Bug report
description: Report reproducible SINAPSE AI behavior that is incorrect
title: "bug: "
labels: ["bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, customer data, or undisclosed vulnerabilities. Report security issues through GitHub Private Vulnerability Reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what impact does it have?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest sequence that consistently reproduces the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste redacted output from `npx sinapse-ai@latest status` and `npx sinapse-ai@latest doctor`.
      render: shell
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude Code and Codex
        - Claude Code
        - Codex
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer or updater
        - CLI
        - Agents, skills, or tasks
        - Provider parity
        - GitHub Actions or release
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SINAPSE AI version
      description: Use the version shown by `npx sinapse-ai@latest status` or the npm package version.
      placeholder: "1.27.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, npm version, and shell.
      placeholder: "Windows 11, Node.js 22.17.0, npm 10.9.2, PowerShell 7"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I reproduced this with the latest public version.
          required: true
        - label: I removed secrets, private paths, and customer data.
          required: true
