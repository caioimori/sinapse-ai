name: Test coverage proposal
description: Identify behavior that needs stronger automated evidence
title: "test: "
labels: ["type: test", "status: needs-triage"]
body:
  - type: textarea
    id: risk
    attributes:
      label: Untested behavior and risk
      description: What can regress, and what user or release surface is affected?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed coverage
      description: List unit, integration, isolated-install, or end-to-end scenarios.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence
      description: Link existing tests, coverage output, issue, or failure.
  - type: dropdown
    id: provider
    attributes:
      label: Provider scope
      options:
        - Claude Code and Codex
        - Claude Code
        - Codex
        - Provider-independent
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified the behavior is not already covered.
          required: true
        - label: The proposed tests assert behavior, not only file existence.
          required: true
        - label: I can contribute the tests.
