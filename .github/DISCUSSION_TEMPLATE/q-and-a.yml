title: "[Pergunta] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        ## Faça sua Pergunta
        Tem uma dúvida sobre o SINAPSE AI? Pergunte aqui e a comunidade poderá ajudar.

        **Antes de postar:**
        - Verifique discussões e a documentação existente
        - Busque perguntas similares
        - Inclua exemplos de código relevantes

  - type: dropdown
    id: question-type
    attributes:
      label: Tipo de Pergunta
      description: Que tipo de ajuda você precisa?
      options:
        - Como eu faço...? (Pergunta de uso)
        - Por que...? (Entender comportamento)
        - Qual a melhor forma de...? (Boas práticas)
        - É possível...? (Pergunta sobre capacidade)
        - Outro
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Sua Pergunta
      description: Seja o mais específico possível
      placeholder: |
        Descreva sua pergunta em detalhes...

        Inclua:
        - O que você está tentando fazer
        - O que você já tentou
        - Mensagens de erro ou comportamento inesperado
    validations:
      required: true

  - type: textarea
    id: code-example
    attributes:
      label: Exemplo de Código (se aplicável)
      description: Compartilhe código relevante para nos ajudar a entender sua pergunta
      render: javascript

  - type: textarea
    id: context
    attributes:
      label: Contexto Adicional
      description: Qualquer informação adicional relevante
      placeholder: |
        - SO: Windows/macOS/Linux
        - Versão do Node.js:
        - Versão do SINAPSE:
        - IDE: Claude Code/Codex/Outro

  - type: markdown
    attributes:
      value: |
        ---
        **Dica:** Perguntas marcadas como respondidas ajudam futuros usuários. Se sua pergunta for resolvida, marque a melhor resposta.
