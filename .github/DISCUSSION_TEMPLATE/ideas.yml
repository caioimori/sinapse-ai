title: "[Ideia] "
labels:
  - idea
  - community
body:
  - type: markdown
    attributes:
      value: |
        ## Compartilhe sua Ideia
        Obrigado por contribuir! Descreva sua ideia claramente para que possamos avaliar.

  - type: dropdown
    id: area
    attributes:
      label: Área relacionada
      description: Selecione a área mais relevante para sua ideia
      options:
        - sinapse-ai (Core Framework)
        - Squads (Pacotes de Agentes)
        - CLI e Installer
        - Documentação
        - Outro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição da ideia
      description: O que você gostaria de ver no SINAPSE AI?
      placeholder: |
        Uma descrição clara e concisa da sua ideia...

        - Qual problema ela resolve?
        - Quem se beneficiaria?
        - Como deveria funcionar?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Caso de Uso
      description: Como você usaria esta funcionalidade?
      placeholder: |
        Descreva um cenário real em que isso seria útil...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
      description: Você considerou alguma alternativa ou workaround?
      placeholder: |
        - Alternativa 1
        - Alternativa 2
        - Workaround atual (se houver)

  - type: checkboxes
    id: contribution
    attributes:
      label: Você estaria disposto a contribuir?
      options:
        - label: Tenho interesse em implementar esta funcionalidade
        - label: Posso ajudar com documentação
        - label: Posso ajudar com testes

  - type: markdown
    attributes:
      value: |
        ---
        **Nota:** Ideias são revisadas pelos maintainers. Ideias aprovadas podem se tornar GitHub Issues para implementação.
