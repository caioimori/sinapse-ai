title: "[Ajuda] "
labels:
  - help-wanted
  - troubleshooting
body:
  - type: markdown
    attributes:
      value: |
        ## Solução de Problemas
        Encontrou um problema? Vamos resolver juntos!

        **Nota:** Se você confirmou que é um bug, [abra uma issue](https://github.com/caioimori/sinapse-ai/issues/new/choose).

  - type: textarea
    id: problem
    attributes:
      label: O que está acontecendo?
      description: Descreva o problema que você está enfrentando
      placeholder: |
        Descreva o que está dando errado...

        - O que você estava tentando fazer?
        - O que aconteceu em vez disso?
        - Alguma mensagem de erro?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
      description: O que deveria ter acontecido?

  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Como podemos reproduzir este problema?
      placeholder: |
        1. Passo 1
        2. Passo 2
        3. Ver erro

  - type: textarea
    id: code
    attributes:
      label: Código / Configuração
      description: Compartilhe código ou configuração relevante
      render: javascript

  - type: textarea
    id: error
    attributes:
      label: Saída de Erro
      description: Mensagens de erro ou stack traces
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informações do seu sistema
      placeholder: |
        - SO: Windows 11 / macOS / Ubuntu
        - Node.js: v20.x
        - SINAPSE versão: x.x.x
        - IDE: Claude Code / Codex / Outro
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: O que você já tentou?
      description: Liste soluções que você já tentou
      placeholder: |
        - Tentei reiniciar...
        - Limpei cache...
        - Consultei a documentação...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Busquei discussões existentes sobre problemas similares
        - label: Consultei a documentação
        - label: Tentei com a versão mais recente

  - type: markdown
    attributes:
      value: |
        ---
        **Dica:** Quanto mais detalhes você fornecer, mais rápido poderemos ajudar. Se isso se confirmar como um bug, um maintainer ajudará você a abrir uma issue.
