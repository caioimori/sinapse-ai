<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F005-N · Painel sintético</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101822;color:#edf3f9;font:17px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:clamp(18px,4vw,48px)}h1{font-size:clamp(26px,4vw,44px);line-height:1.15}p{max-width:65ch}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;border:1px solid #65778b;border-radius:16px;padding:22px;background:#182433}.rail{height:12px;background:#526175;border-radius:8px;overflow:hidden}.bar{height:100%;background:#8edac9;transform-origin:left;transform:scaleX(1)}.badge{display:block;color:#8edac9;opacity:1}.track{height:40px;position:relative;border-bottom:1px solid #65778b;overflow:hidden}.marker{position:absolute;left:0;bottom:8px;width:18px;height:18px;border-radius:50%;background:#8edac9;transform:translateX(0)}button{font:inherit;color:#101822;background:#c5e4ff;border:2px solid transparent;border-radius:8px;padding:10px 16px;margin:6px 8px 6px 0;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}button:disabled{opacity:.65;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;border-top:1px solid #65778b;padding-top:14px}#phase{min-height:2em}@media(max-width:700px){.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.marker{transform:none!important}.badge{opacity:1!important}.bar{transform:scaleX(1)!important}}
</style>
<main><h1>Painel de operação</h1><p>Dados sintéticos constantes. O movimento demonstra uma sequência finita de seis segundos; informação e ações estão disponíveis imediatamente.</p>
<div class="cards"><section class="card"><h2>Progresso</h2><p>100% concluído</p><div class="rail" aria-hidden="true"><div id="bar" class="bar"></div></div></section><section class="card"><h2>Disponibilidade</h2><p>Serviço disponível</p><span id="badge" class="badge" aria-hidden="true">● Disponível</span></section><section class="card"><h2>Entrega</h2><p>Entrega concluída</p><div class="track" aria-hidden="true"><span id="marker" class="marker"></span></div></section></div>
<p id="phase" role="status" aria-live="polite">Pronto</p><button id="pause" type="button">Pausar movimento</button><button id="restart" type="button">Reiniciar demonstração</button><button id="export" type="button">Mostrar medição</button><pre id="trace" aria-label="Registro da sequência"></pre>
</main>
<script>
'use strict';
function createPanel(env){
 const {document:doc,window:win,requestAnimationFrame:raf,cancelAnimationFrame:caf,performance:clock}=env;
 const el=id=>doc.getElementById(id), media=win.matchMedia('(prefers-reduced-motion: reduce)');
 const bar=el('bar'),badge=el('badge'),marker=el('marker'),pause=el('pause'),restart=el('restart'),out=el('trace'),phase=el('phase');
 const removers=[], duration=6000, seed=5005; let frame=null, elapsed=0,last=null,running=false,disposed=false,userPaused=false;
 const trace={schemaVersion:1,caseId:'F005-N',fixture:{seed,durationMs:duration,animations:['progress-scale','availability-opacity','delivery-translate'],renderer:'DOM/CSS + owned requestAnimationFrame',imports:[]},environment:{userAgent:win.navigator.userAgent,viewport:{width:win.innerWidth,height:win.innerHeight},devicePixelRatio:win.devicePixelRatio,refreshHz:null,hardware:'UNVERIFIED; attach operator declaration',gpu:'UNVERIFIED'},budget:{status:'PROPOSED_NOT_MEASURED',targetHz:60,frameMs:1000/60,p95Ms:20,p99Ms:34,stallsOverMs:50},frames:[],events:[],interactionMs:[],inventory:[]};
 function inventory(){return {ownedRaf:frame===null?0:1,ownedListeners:removers.length,ownedTimers:0,ownedContexts:0,ownedTimelines:0,borrowedMediaDisposed:false};}
 function append(list,item,limit){if(list.length>=limit)list.shift();list.push(item);} function event(type){append(trace.events,{type,at:clock.now(),elapsed, reduced:media.matches, userPaused},256);}
 function finalVisual(){bar.style.transform='scaleX(1)';badge.style.opacity='1';marker.style.transform='translateX(0px)';}
 function cancel(){if(frame!==null)caf(frame);frame=null;last=null;running=false;}
 function control(){pause.disabled=media.matches||elapsed>=duration;pause.textContent=userPaused?'Retomar movimento':'Pausar movimento';pause.setAttribute('aria-pressed',String(userPaused));phase.textContent=media.matches?'Movimento reduzido: informações completas.':userPaused?'Movimento pausado.':elapsed>=duration?'Demonstração concluída.':'Demonstração em execução.';}
 function schedule(){if(!disposed&&running&&frame===null)frame=raf(tick);}
 function tick(now){frame=null;if(disposed||!running)return;if(last!==null){const dt=now-last;append(trace.frames,{at:now,dt,approxMissedAt60Hz:Math.max(0,Math.round(dt/(1000/60))-1)},2048);elapsed=Math.min(duration,elapsed+dt);}last=now;const t=elapsed/duration;bar.style.transform='scaleX('+t+')';badge.style.opacity=String(.75+.25*t);marker.style.transform='translateX('+(48*Math.sin(Math.PI*t)).toFixed(3)+'px)';if(elapsed>=duration){cancel();finalVisual();event('complete');control();}else schedule();}
 function start(){if(disposed)return;cancel();elapsed=0;userPaused=false;finalVisual();if(media.matches){elapsed=duration;event('reduced-static');}else{running=true;event('start');schedule();}control();}
 function timed(fn){return ()=>{if(disposed)return;const begin=clock.now();fn();append(trace.interactionMs,clock.now()-begin,256);};}
 function toggle(){if(media.matches||elapsed>=duration)return;if(running){userPaused=true;cancel();event('pause');}else{userPaused=false;running=true;event('resume');schedule();}control();}
 function preference(){if(disposed)return;if(media.matches){cancel();elapsed=duration;userPaused=false;finalVisual();event('preference-reduced');}else{event('preference-restored-no-auto-restart');}control();}
 function visibility(){if(doc.hidden&&running){userPaused=true;cancel();event('hidden-paused');control();}}
 function listen(target,type,fn){target.addEventListener(type,fn);removers.push(()=>target.removeEventListener(type,fn));}
 function report(){const sorted=trace.frames.map(f=>f.dt).sort((a,b)=>a-b),q=p=>sorted.length?sorted[Math.ceil(p*sorted.length)-1]:null;return {...trace,summary:{samples:sorted.length,p50Ms:q(.5),p95Ms:q(.95),p99Ms:q(.99),maxMs:sorted.length?sorted[sorted.length-1]:null,stallsOver50Ms:sorted.filter(n=>n>50).length,approxMissedAt60Hz:trace.frames.reduce((a,f)=>a+f.approxMissedAt60Hz,0),maxInteractionMs:trace.interactionMs.length?Math.max(...trace.interactionMs):null,scope:'rAF intervals and synchronous handler time only; browser Performance trace required for CPU/layout/paint/GPU and input latency'},state:{elapsed,running,reduced:media.matches,disposed},resources:inventory()};}
 listen(pause,'click',timed(toggle));listen(restart,'click',timed(start));listen(el('export'),'click',()=>{out.textContent=JSON.stringify(report(),null,2);});listen(media,'change',preference);listen(doc,'visibilitychange',visibility);
 function dispose(){if(disposed)return;cancel();disposed=true;while(removers.length)removers.pop()();finalVisual();event('dispose');trace.inventory.push(inventory());}
 listen(win,'pagehide',dispose);trace.inventory.push(inventory());start();return {start,toggle,dispose,report};
}
if(typeof window!=='undefined') window.F005Panel=createPanel({document,window,requestAnimationFrame:requestAnimationFrame.bind(window),cancelAnimationFrame:cancelAnimationFrame.bind(window),performance});
</script></html>
